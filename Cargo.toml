[package]
name = "dijkstra"
version = "0.4.15"
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
time = "0.3.55"
futures = "0.3.34"
lazy_static = "1.5.1"
log = "0.4.35"
redis = { version = "1.8.2", features = [
    "acl",
    "aio",
    "r2d2",
    "geospatial",
    "script",
    "tokio-comp",
    "cluster",
] }
rmp-serde = "1.3.1"
sea-orm = { version = "1.1.20", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "macros",
    "default",
    "debug-print",
    "mock",
    "tests-cfg",
] }
sea-query = { version = "0.32.7", features = [
    "uuid",
    "bigdecimal",
    "with-bigdecimal",
    "with-chrono",
    "with-json",
    "backend-postgres",
    "sea-query-derive",
    "derive",
    "with-uuid",
    "thread-safe",
    "postgres-types",
    "with-time",
] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full", "rt"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
async-trait = "0.1.92"
#async_nursery = "0.6.0"
bb8 = "0.9.1"
bb8-redis = "0.26.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
serde_json = "1.0.154"
pomelo = "0.2.3"
regex = "1.13.2"
#higher-order-closure = "0.0.5"
botapi = { path = "botapi-rs", features = ["rhai"] }
confy = "1.0.0"
sea-orm-migration = "1.1.20"
nonblock-logger = { version = "0.2.2", features = ["color"] }
dashmap = "6.2.1"
once_cell = "1.21.4"
#openssl = { version = "0.10.75", features = ["vendored"] }
prometheus = "0.14.0"
#warp = "0.3.7"
prometheus-hyper = "0.2.1"
markdown = "1.0.0"
itertools = "0.14.0"
macros = { path = "macros" }
hyper = "1.12.0"
#strum = "0.27.2"
humantime = "2.4.0"
captcha = "1.0.0"
rand = "0.9.5"
base64 = "0.22.1"
glob-match = "0.2.1"
globset = { version = "0.4.21", features = ["serde"] }
#wildmatch = "2.6.1"
glob = "0.3.4"
rhai = { version = "1.27.0", features = [
    "serde",
    "sync",
    "metadata",
    "internals",
] }
#llama-rs = { path = "./llama-rs/llama-rs" }
#rusty_pool = "0.7.0"
#seq-macro = "0.3.6"
convert_case = "0.8.0"
unicase = "2.10.0"
unicase_serde = "0.1.0"
yoke = { version = "0.8.4", features = ["derive", "serde"] }
governor = "0.10.4"
#rustls-webpki = "0.103.9"
reqwest = "0.12.28"
bytes = { version = "1.12.2", features = ["serde"] }
lz4_flex = "0.11.7"
sqlx = "0.8.6"
threadpool = "1.8.1"
num_cpus = "1.17.0"
redis-test = { version = "1.0.4", features = [
    "futures",
    "aio",
] }
humanize-duration = { version = "0.0.7", features = ["chrono"] }
random = "0.14.1"
ctor = "0.6.3"
sqlx-core = "0.8.6"


[build-dependencies]
anyhow = "1.0.104"

[dev-dependencies]
env_logger = "0.11.12"
